
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <h2 class="logo">My Project</h2>
    <div class="links">
        <a href="index.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="task4.html">Task 4</a>
    </div>
</nav>

<main>
    <h1>Task 4 - Registration</h1>
    <form class="row g-3 was-validated">

        <div class="col-md-6">
            <label for="first" class="form-label">First Name</label>
            <input type="text" id="first" name="first"
                   class="form-control" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">First name is required.</div>
        </div>

        <div class="col-md-6">
            <label for="last" class="form-label">Last Name</label>
            <input type="text" id="last" name="last"
                   class="form-control" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Last name is required.</div>
        </div>

        <div class="col-12">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email"
                   class="form-control" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Enter a valid email.</div>
        </div>

        <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password"
                   class="form-control" minlength="8" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Minimum 8 characters.</div>
        </div>

        <div class="col-md-6">
            <label for="confirm" class="form-label">Confirm Password</label>
            <input type="password" id="confirm" name="confirm"
                   class="form-control" minlength="8" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Minimum 8 characters.</div>
        </div>

        <div class="col-12">
            <label class="form-label">Gender</label>

            <div class="form-check">
                <input type="radio" id="male" name="gender"
                       value="male" class="form-check-input" required>
                <label for="male" class="form-check-label">Male</label>
            </div>

            <div class="form-check">
                <input type="radio" id="female" name="gender"
                       value="female" class="form-check-input" required>
                <label for="female" class="form-check-label">Female</label>
                <div class="invalid-feedback">Select a gender.</div>
            </div>
        </div>

        <div class="col-12">
            <label class="form-label">Hobbies</label>

            <div class="form-check">
                <input type="checkbox" id="sports" name="hobbies"
                       value="sports" class="form-check-input">
                <label for="sports" class="form-check-label">Sports</label>
            </div>

            <div class="form-check">
                <input type="checkbox" id="music" name="hobbies"
                       value="music" class="form-check-input">
                <label for="music" class="form-check-label">Music</label>
            </div>

            <div class="form-check">
                <input type="checkbox" id="games" name="hobbies"
                       value="games" class="form-check-input">
                <label for="games" class="form-check-label">Games</label>
            </div>
        </div>

        <div class="col-12">
            <label for="country" class="form-label">Country</label>
            <select id="country" name="country" class="form-select" required>
                <option value="">Choose country</option>
                <option value="kz">Kazakhstan</option>
                <option value="uz">Uzbekistan</option>
                <option value="kg">Kyrgyzstan</option>
            </select>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Select a country.</div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-warning">Register</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
        </div>

    </form>
</main>

</body>
</html>
