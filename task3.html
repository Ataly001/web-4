<main>
    <h1>Task3 - Bootstrap validation</h1>
    <form class="row g-3 was-validated">
        <div class="col-12">
           <label for="name" class="form-label">Name:</label>
           <input type="text" id="name" name="name"
                  class="form-control" required minlength="2">
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Enter at least 2 characters.</div>
        </div>

        <div class="col-12">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email"
                   class="form-control" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Enter a valid email.</div>
        </div>

        <div class="col-12">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" name="message"
                      class="form-control" required minlength="10"></textarea>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Enter at least 10 characters.</div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-warning">Submit</button>
        </div>
    </form>
</main>

</body>
